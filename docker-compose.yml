services:
  configserver:
    build:
      context: ./configserver
    container_name: configserver
    ports:
      - "8071:8071"
    environment:
      GIT_PASSWORD: ${GIT_PASSWORD}
      AES_256_KEY: ${AES_256_KEY}
      SERVER_PORT: 8071
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8071/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  eurekaserver:
    build:
      context: ./eurekaserver
    container_name: eurekaserver
    ports:
      - "8070:8070"
    environment:
      SERVER_PORT: 8070
      SPRING_CONFIG_IMPORT: optional:configserver:http://configserver:8071
      SPRING_CLOUD_CONFIG_URI: http://configserver:8071
    depends_on:
      configserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8070/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  guitarorders:
    build:
      context: ./guitarorders
    container_name: guitarorders
    ports:
      - "8080:8080"
    command:
      [
        "java",
        "-Dspring.config.import=optional:configserver:http://configserver:8071/",
        "-Dspring.cloud.config.uri=http://configserver:8071/",
        "-Deureka.client.serviceUrl.defaultZone=http://eurekaserver:8070/eureka",
        "-jar",
        "app.jar"
      ]
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy

  guitarinventory:
    build:
      context: ./guitarinventory
    container_name: guitarinventory
    ports:
      - "9090:9090"
    command:
      [
        "java",
        "-Dspring.config.import=optional:configserver:http://configserver:8071/",
        "-Dspring.cloud.config.uri=http://configserver:8071/",
        "-Deureka.client.serviceUrl.defaultZone=http://eurekaserver:8070/eureka",
        "-jar",
        "app.jar"
      ]
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy

  gatewayserver:
    build:
      context: ./gatewayserver
    container_name: gatewayserver
    ports:
      - "8072:8072"
    command:
      [
        "java",
        "-Dspring.config.import=optional:configserver:http://configserver:8071/",
        "-Dspring.cloud.config.uri=http://configserver:8071/",
        "-Deureka.client.serviceUrl.defaultZone=http://eurekaserver:8070/eureka",
        "-Dspring.data.redis.host=host.docker.internal",
        "-Dspring.data.redis.port=6379",
        "-jar",
        "app.jar"
      ]
    depends_on:
      - configserver
      - eurekaserver
      - guitarorders
      - guitarinventory