server:
  port: 9090
spring:
  cloud:
    compatibility-verifier:
      enabled: false # lab 16: disable version check
  application:
    name: "inventory" # this is the endpoint (name visible in Eureka)
  profiles:
    active: "prod"
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  config:
   import: "optional:configserver:http://localhost:8071/" # lab 16: config server port 8071
management:
  endpoints:
    web:
      exposure:
        # include: "*" # Lab 19
        include: info, shutdown # lab 22
  endpoint:
    shutdown:
      enabled: true
  info: # indentation!!!!
    env:
      enabled: true
        
eureka:
  instance:
    preferIpAddress: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8070/eureka
      
info:
  app:
    name: "orders"
    description: "Microservices Architecture CA2: Guitar Inventory Application"
    version: "1.1.0"
    
logging:
  level:
    com:
      tus:
        guitarinventory: DEBUG
        
        
# Screencast: Resiliency - Circuit Breaker
resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 8
      permittedNumberOfCallsInHalfOpenState: 2
      failureRateThreshold: 50
      waitDurationInOpenState: 5000 # 5 seconds    